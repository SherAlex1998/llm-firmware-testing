id: pcd8544_2048
name: "2048 tile game on a Nokia 5110 (PCD8544) display with four buttons and EEPROM game save"
source_url: https://github.com/zhaofengli/2048-arduino
license: BSD-2-Clause
repo_created: 2014-06-01
experiment: 2
category: display
complexity: complex
backend: avr8js
sources: [logic.h, logic.cpp, config.h, base.h, board.h, button.h, display.h, format.h, random.h, gamesave.h,
          battery.h, serial.h, bitmap.h]
interrupts: false
pins:
  - {pin: 10, mode: INPUT_PULLUP, role: "button up, LOW = pressed (not connected in the test setup: reads HIGH)"}
  - {pin: 8, mode: INPUT_PULLUP, role: "button left (not connected: HIGH)"}
  - {pin: 7, mode: INPUT_PULLUP, role: "button down (not connected: HIGH)"}
  - {pin: 9, mode: INPUT_PULLUP, role: "button right (not connected: HIGH)"}
  - {pin: 12, mode: OUTPUT, role: "PCD8544 reset (bit-banged display: SCE 11, DC 2, DIN 3, CLK 4, backlight 6)"}
  - {pin: 17, mode: INPUT, role: "A3 random entropy source (not connected: reads 0)"}
  - {pin: 19, mode: INPUT, role: "A5 battery voltage (not connected: reads 0)"}
entry_functions:
  - "void initGame()"
  - "void gameStep()"
  - "bool gameStepWith(int direction)"
  - "void afterMove()"
  - "void initBoard()"
  - "void placeNewTile()"
  - "bool moveUp()"
  - "bool moveLeft()"
  - "bool moveDown()"
  - "bool moveRight()"
  - "unsigned char moveOnce(unsigned char x, unsigned char y, bool h, bool v, bool hv, bool vv, bool noMerge)"
  - "unsigned char getStatus()"
  - "unsigned int getLargestTile()"
  - "bool isCoordValid(unsigned char x, unsigned char y)"
  - "bool isPressed(unsigned char button)"
  - "bool buttonControl()"
  - "bool saveGame(unsigned int board[][4])"
  - "bool loadGame(unsigned int board[][4])"
  - "char *getTileString(char *buffer, unsigned int value)"
loc: 836
metrics: {nloc: 836, ccn_sum: 205, ccn_max: 16, functions: 48}
notes: >-
  Source: 2048.ino + header-only game code (base.h, board.h, display.h, button.h, random.h, format.h, gamesave.h,
  battery.h, serial.h, config.h, bitmap.h) copied unchanged except: config.h moves the display reset/SCE from pins
  0/1 (which "obstruct the serial interface", as the original notes) to 12/11, enableSerial stays 0; base.h splits
  the endless loopGame() into gameStep() (one pass) + afterMove(), with lastLargestTile as a global instead of a
  local, and adds the twin gameStepWith(direction). setup() calls initGame(), loop() calls gameStep(); logic.cpp
  compiles the headers once and logic.h declares the functions and globals for tests. NLOC slightly above 800
  (the complex bound was widened to 850 for it, see Plan/exp2). The EEMEM initial values (contrast, save flag) are
  not flashed by the harness, so EEPROM starts erased. avr8js backend: the display is output-only.
